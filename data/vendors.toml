# 厂商表 —— 单一权威源
#
# models 构建时直接读这张表做厂商归一与别名展开，不在代码里硬编码。
#
# 字段
#   name      显示名（中国厂商用中文，国外用英文）
#   alias     该厂商在各源的写法。**只要在任一源出现过，就要列全**，
#             否则同一家会被当成两家（deepseek-ai / deepseekai / ds）
#   website   官网
#   api_docs  模型文档 / 定价页
#   cn        是否按人民币计价（决定价格单位与来源优先级）
#   region    cn / global，仅用于展示分类
#
# 注意：alias 里不要写聚合商/中转商，那些不是厂商。

# ── 国际 ────────────────────────────────────────────────────────────────

