name: Build & Deploy

on:
  # 每 2 小时重建一次。上游（厂商文档、models.dev 仓库）变动不频繁，
  # 更高频只增加噪音；但两次/天又不足以跟上新模型发布节奏。
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: write

concurrency:
  # 防止手动触发与定时任务撞车，同时只跑一个构建
  group: build-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 单元测试（不联网）
        run: |
          pip install --upgrade pip
          python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install --upgrade pip

      # models.dev 稀疏克隆约 39MB，每次跑都拉一次以免用旧数据
      - name: 缓存 models.dev 仓库
        uses: actions/cache@v4
        with:
          path: ~/.cache/model-data
          key: model-data-cache-${{ github.run_id }}
          restore-keys: |
            model-data-cache-

      - name: 构建
        env:
          PYTHONPATH: src
          MIMI_API_KEY: ${{ secrets.MIMI_API_KEY }}
        run: |
          python -m model_data.cli -o out --strict \
            --dump-observations out/observations.json

      - name: 汇总
        run: |
          python - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path("out/models.json").read_text())
          import json as j
          v = j.loads(pathlib.Path("out/vendors.json").read_text())
          print(f"模型数: {d['count']}  厂商数: {v['count']}")
          print(f"生成时间: {d['generated_at']}")
          PY

      - name: 准备发布
        run: |
          mkdir -p /tmp/out
          cp out/models.json out/vendors.json /tmp/out/
          cp data/gh-pages-index.html /tmp/out/index.html

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: 部署到 gh-pages
        run: |
          cp /tmp/out/models.json /tmp/out/vendors.json /tmp/out/index.html .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models.json vendors.json index.html
          git diff --cached --quiet && echo "无变化，跳过提交" || \
            git commit -m "deploy: $(date -u +'%Y-%m-%d %H:%M UTC')"

      - name: 推送
        run: git push origin gh-pages
